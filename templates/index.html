<!DOCTYPE html>
<html>
<head>
    <title>House Price Prediction</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='style.css') }}">
</head>
</head>
<body>
    <h1>House Price Prediction System</h1>

    <form method="POST">
        <input type="number" name="OverallQual" placeholder="Overall Quality" required><br><br>
        <input type="number" name="GrLivArea" placeholder="Living Area" required><br><br>
        <input type="number" name="TotalBsmtSF" placeholder="Basement Area" required><br><br>
        <input type="number" name="GarageCars" placeholder="Garage Cars" required><br><br>
        <input type="number" name="FullBath" placeholder="Full Baths" required><br><br>
        <input type="number" name="YearBuilt" placeholder="Year Built" required><br><br>

        <button type="submit">Predict</button>
    </form>

    {% if prediction %}
        <h3>Predicted Price: #{{ prediction }}</h3>
    {% endif %}
</body>
</html>
